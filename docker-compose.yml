# LMAIL — Mautic 5 stack (database, web app, cron).
# All settings and passwords come from .env (copy .env.example → .env).
#
# Local:       docker compose up -d                → http://localhost:8080
# Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
x-mautic-env: &mautic-env
  MAUTIC_DB_HOST: db
  MAUTIC_DB_PORT: 3306
  MAUTIC_DB_DATABASE: ${MYSQL_DATABASE}
  MAUTIC_DB_USER: ${MYSQL_USER}
  MAUTIC_DB_PASSWORD: ${MYSQL_PASSWORD}
  MAUTIC_TRUSTED_PROXIES: '["0.0.0.0/0"]'
  PHP_INI_VALUE_DATE_TIMEZONE: ${TZ:-UTC}
  # AI email writer (LMAIL plugin). Leave empty to keep the AI writer switched off.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  mautic:
    image: mautic/mautic:${MAUTIC_VERSION:-5-apache}
    restart: unless-stopped
    ports:
      - "${LMAIL_HTTP_PORT:-8080}:80"
    environment:
      <<: *mautic-env
      DOCKER_MAUTIC_ROLE: mautic_web
    volumes:
      - mautic_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: mautic/mautic:${MAUTIC_VERSION:-5-apache}
    restart: unless-stopped
    environment:
      <<: *mautic-env
      DOCKER_MAUTIC_ROLE: mautic_cron
    volumes:
      - mautic_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  mautic_data:
