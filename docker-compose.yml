# LMAIL — local demo stack. Demo credentials only;
# in production these come from an .env file, never committed.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: lmaildb
      MYSQL_USER: lmail
      MYSQL_PASSWORD: lmailpass123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass123"]
      interval: 5s
      timeout: 5s
      retries: 20

  mautic:
    image: mautic/mautic:5-apache
    ports:
      - "8080:80"
    environment:
      DOCKER_MAUTIC_ROLE: mautic_web
      MAUTIC_DB_HOST: db
      MAUTIC_DB_PORT: 3306
      MAUTIC_DB_DATABASE: lmaildb
      MAUTIC_DB_USER: lmail
      MAUTIC_DB_PASSWORD: lmailpass123
    volumes:
      - mautic_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: mautic/mautic:5-apache
    environment:
      DOCKER_MAUTIC_ROLE: mautic_cron
      MAUTIC_DB_HOST: db
      MAUTIC_DB_PORT: 3306
      MAUTIC_DB_DATABASE: lmaildb
      MAUTIC_DB_USER: lmail
      MAUTIC_DB_PASSWORD: lmailpass123
    volumes:
      - mautic_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  mautic_data:
